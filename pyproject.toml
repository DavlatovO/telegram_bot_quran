[project]
name = "telegram-bot-quran"
version = "1.0.0"
description = "Telegram bot that serves Qur'an verses and surahs in English, Arabic, and Uzbek."
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.15,<4",
    "aiohttp>=3.10",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.6",
    "cachetools>=5.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

# This is a deployable app, not an importable library: tell the build backend
# there is nothing to package so `pip install -e ".[dev]"` just resolves deps.
[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
